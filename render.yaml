# Blueprint ל-Render, בתצורה חינמית לחלוטין.
#
# איך זה חינמי והנתונים נשמרים:
#   לשירות חינמי ב-Render אין דיסק מתמיד, ולכן מסד הנתונים אינו יושב עליו.
#   הוא יושב ב-Turso - SQLite מנוהל עם שכבה חינמית שאינה פגה.
#   אותו SQL ואותן מיגרציות; רק הדרייבר שונה.
#
# מה שחייב להיות מוגדר בלוח הבקרה של Render (Environment -> Add):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, SESSION_SECRET, ACCESS_CODE,
#   SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD
# הם מסומנים כאן sync: false במכוון - סוד בקובץ שנכנס לגיט אינו סוד.
#
# מגבלות התוכנית החינמית, כדי שלא יהיו הפתעות:
#   * השירות נרדם אחרי 15 דקות בלי תנועה. הכניסה הראשונה אחריהן איטית.
#   * אין גישת shell, ולכן חשבון המנהל נוצר אוטומטית בעלייה הראשונה
#     לפי SEED_ADMIN_EMAIL ו-SEED_ADMIN_PASSWORD.
#   * עותק אחד בלבד.

services:
  - type: web
    name: personal-coach
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # הקרוב ביותר לישראל מבין אזורי Render
    healthCheckPath: /api/health/db
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: turso
      - key: TRUST_PROXY
        value: "1"
      - key: QUICK_ACCESS
        value: "on"
      - key: AI_PROVIDER
        value: none
      # להגדיר בלוח הבקרה, לא כאן:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # ריק = הוראות כתובות במקום סרטונים
      - key: MEDIA_BASE_URL
        sync: false
