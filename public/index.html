<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מאמן אישי - אימונים ותזונה</title>

<!-- viewport-fit=cover נדרש כדי לכבד את ה-safe area של אייפון (נאטץ' וכיסוי תחתון) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="תוכנית אימונים אישית, הדגמות, ליווי תזונתי ומעקב התקדמות - בעברית, מותאם לטלפון.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">

<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">

<!-- תמיכת Apple: התקנה למסך הבית, מצב אפליקציה, שורת מצב ומסכי פתיחה -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מאמן אישי">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1536x2048.png"
      media="(min-device-width: 768px) and (-webkit-device-pixel-ratio: 2)">

<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main">דלג לתוכן</a>

<header class="topbar" id="topbar" hidden>
  <button class="icon-btn" id="btn-back" aria-label="חזרה" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 class="topbar__title" id="screen-title">מאמן אישי</h1>
  <button class="icon-btn" id="btn-theme" aria-label="מעבר בין מצב כהה לבהיר">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10L5.6 18.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</header>

<main id="main" class="screen" aria-live="polite"></main>

<nav class="tabbar" id="tabbar" hidden aria-label="ניווט ראשי"></nav>

<div class="toast-host" id="toast-host" aria-live="assertive"></div>

<!-- באנר התקנה: מוצג רק אם האפליקציה לא מותקנת. באייפון ההתקנה היא דרך "שתף > הוסף למסך הבית" -->
<div class="install-banner" id="install-banner" hidden>
  <div class="install-banner__text" id="install-text"></div>
  <div class="install-banner__actions">
    <button class="btn btn--sm btn--primary" id="install-action" hidden>התקנה</button>
    <button class="btn btn--sm btn--ghost" id="install-dismiss">סגור</button>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
